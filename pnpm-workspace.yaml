packages:
  - 'apps/*'
  - 'packages/*'

saveExact: true

overrides:
  minimatch: 11.0.1

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - nodemailer@10.6.1
  - '@eslint/config-array@0.23.7'
  - eslint-config-prettier@10.1.9
  - eslint@10.16.0
