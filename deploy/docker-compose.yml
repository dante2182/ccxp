name: ccip

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ccxp-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../.env:/app/.env:ro
    environment:
      NODE_ENV: production
      PORT: 3001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    networks:
      - ccip

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NUXT_API_TARGET: http://api:3001
    image: ccxp-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../.env:/app/.env:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      NUXT_API_TARGET: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    networks:
      - ccip

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/ccip.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - ccip

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - ccip
    profiles:
      - certbot

networks:
  ccip:
    driver: bridge
